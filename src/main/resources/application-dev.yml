# ============================================================
# dev 环境：本地开发基线（技术规范/09-本地开发基线与Mock策略.md）
# 基础设施：本机 MySQL 8 + Redis 7（docker-compose.dev.yml）
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pw_dev?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      pool-name: PwHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  flyway:
    enabled: true
    # db/migration = 全环境 DDL；db/seed-dev = 仅 dev 种子数据
    locations: classpath:db/migration,classpath:db/seed-dev
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8

pw:
  feature:
    realname: false
    booster-apply-full: false
    minor-check: false
  wechat:
    # 微信官方测试号即可真登录；留空时走 mock-login
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    mock-login: true
  pay:
    mode: simulate
  im:
    enabled: false
  file:
    storage: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.pw: DEBUG
    com.pw.common.security: DEBUG
    org.springframework.web: INFO
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG
